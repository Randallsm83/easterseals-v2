name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: vps54643.dreamhostps.com
          username: easterseals
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            eval "$(mise activate bash)"
            cd ~/app
            git fetch --prune origin main
            git reset --hard origin/main
            npm ci
            npm run build
            cp -r client/dist/* ~/es2.randall.codes/
            "$HOME/bin/pm2-keepalive.sh" deploy es2-api
            SPA_FALLBACK_API_BASE_URL=http://127.0.0.1:8080/api node client/scripts/generate-spa-fallbacks.mjs ~/es2.randall.codes
